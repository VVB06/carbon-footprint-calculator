<style>

.eye{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:#a9d9ff;margin-bottom:12px}h1{font-size:clamp(32px,6.4vw,60px);margin:0 0 10px;font-weight:800;letter-spacing:-.5px;text-shadow:0 4px 30px #000a}.tag{font-size:clamp(14px,2.3vw,19px);color:#d8e4ff;max-width:520px;margin:auto;line-height:1.5;opacity:.92}

#hd,#aL{transition:transform .35s}#mky .ld,#mky .ha,#mky .sq,#mky .mO,#mky .mF,#mky .mR,#mky .mFl,#mky .sw2,#mky .te,#mky .spk,#mky .cld{display:none}
.pp{transform-box:fill-box;transform-origin:center;transition:transform .3s}.hg .mS,.good .mS,.hb .mS,.bad .mS,.pam .mS,.ho .mS,.ok .mS{display:none}.hg .mO,.good .mO{display:block}.hb .mR{display:block}.bad .mF,.pam .mF{display:block}.ho .mFl,.ok .mFl{display:block}

#res{background:radial-gradient(circle at 20% 0,#12403a,#07151a 60%);overflow-y:auto;scroll-snap-type:y mandatory}#res section{min-height:100%;scroll-snap-align:start;padding:34px 20px 40px min(300px,26vw);display:flex;flex-direction:column;justify-content:center;max-width:980px;margin:auto}

details{background:#ffffff10;border-radius:14px;padding:9px 13px;margin:8px 0}summary{cursor:pointer;font-weight:800}.rec{background:#ffffff12;border-left:4px solid var(--g);border-radius:12px;padding:10px 13px;margin:8px 0;font-size:14px;line-height:1.45}.rec b{color:#9ff0c4}.sp{display:inline-block;background:#ffffff18;border-radius:18px;padding:6px 12px;margin:4px;font-size:13px}.pl{display:block;width:100%;text-align:left;background:#ffffff12;border:0;padding:11px;border-radius:12px;margin:6px 0;font-size:14px}.pl.on{background:#2fa37a66}
#res small,#res li{font-size:12.5px;opacity:.85;line-height:1.55}#hint{position:fixed;right:12px;bottom:12px;background:#000a;border-radius:20px;padding:7px 14px;font-size:12px;z-index:30}
@media(max-width:899px){#res section{padding:150px 18px 60px}}
.sen{margin:10px 0 6px;padding:11px 14px;border-radius:14px;background:#f2c14e18;border-left:3px solid var(--g);font-family:Fraunces,Georgia,serif;font-size:15.5px;line-height:1.55;animation:qin .5s}.sen b{color:#ffd978}.undo{background:none;border:0;color:#9fd8c0;font-size:12px;text-decoration:underline;padding:0 0 0 6px;font-family:Manrope,sans-serif}
#qb{transition:opacity .26s,transform .26s}#qb.out{opacity:0;transform:translateY(8px)}#qi.out{opacity:0;transition:.35s}
.chips{display:flex;flex-wrap:wrap;gap:10px}.chip{padding:12px 16px;border-radius:16px;border:1px solid #ffffff2e;background:#ffffff10;font-weight:700;font-size:14.5px;animation:oin .45s var(--d) backwards;transition:.2s}.chip:hover,.chip:focus-visible{background:var(--g);color:#2a1a00;transform:translateY(-3px);outline:none}.chip.sel{background:linear-gradient(135deg,#f2c14e,#1f9d6b);color:#10210f}
.eq{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}.eq div{background:#ffffff12;border-radius:14px;padding:12px;font-size:12.5px;line-height:1.4}.eq b{display:block;font-size:21px;color:#bff2d6;font-family:Fraunces,Georgia,serif}
.cb{display:flex;align-items:center;gap:10px;font-size:13px;margin:7px 0}.cb span{min-width:120px;max-width:150px}.cb i{display:block;height:13px;border-radius:7px;background:linear-gradient(90deg,#2fa37a,#f2c14e);transition:width 1s}.cb em{font-style:normal;opacity:.85;white-space:nowrap}

<script>
const $=s=>document.querySelector(s);
// ---------- DATA: each question = main choice + follow-ups that build one sentence. Emission factors in kg CO2e.
const GR=.71,r=(k,t,el)=>[k,t,el];
const mo=s=>s.split(';').map(x=>{const a=x.split('|');return{e:a[0],l:a[1],v:a[2],q:a[3]||'o'}});
const so=s=>s.split(';').map(x=>{const a=x.split('|');return{l:a[0],v:+a[1],q:a[2]||''}});
const Z=(id,c,t,p,m,s,f,x)=>Object.assign({id,c,t,p,m:mo(m),s:s.map(a=>({k:a[0],t:a[1],o:so(a[2]),p:a[3],a:a[4]||''})),f},x);
const farmer=A=>A.fm&&A.fm.m=='yes',paddy=A=>farmer(A)&&A.cr&&A.cr.m=='pad';
const Q=[
Z('hh','You & home','Who shares your home?','I live with {m}','🧍|Just me|1;👫|Two of us|2;👪|Three people|3;🏠|Four people|4;🏡|Five or more|5.5',[['hm','What kind of home is it?','City flat|0;Independent house|0;Village or farm house|0','in a {}','']],()=>r(0,'Used as the divisor for shared energy, cooking, water, waste and farm emissions.'),{r:'5'}),
Z('com','Transport','How do you usually get to work, school or college?','My usual commute: {m}','🚶|Walk or cycle|walk|g;🚌|Bus|bus;🚇|Metro or train|met|g;🛵|Two-wheeler|2w;🚗|Car|car|b;🚕|Auto or cab|cab|b;🏠|No commute, I stay home|home|g',[
['veh','Which two-wheeler is it?','Electric scooter|0.02|g;100–110 cc commuter|0.04;125–160 cc bike or scooter|0.05;200 cc+ bike|0.07|b','on a {}','2w'],
['veh','Which car is it?','Electric|0.10|g;CNG|0.11;Small petrol hatchback|0.13;Petrol sedan|0.17|b;Diesel or petrol SUV|0.24|b','in a {}','car'],
['km','How far is it one way?','Under 3 km|2;3–8 km|5;8–15 km|11;15–30 km|22|b;30+ km|40|b','about {} each way','!walk,home'],
['d','How many days a week?','3 days|3;4 days|4;5 days|5;6 days|6','{} a week','!home'],
['occ','Who rides with you?','Nobody else|1|b;One other person|2;Three or more people|3.3|g','with {}','2w,car']],
(m,s)=>{const ef={walk:0,home:0,bus:.05,met:.03,cab:.12}[m];const e=ef===undefined?s.veh:ef,o=s.occ||1;return r((s.km||0)*2*(s.d||0)*48*e/o,`${s.km||0} km ×2 × ${s.d||0} d × 48 wk × ${e} kg/km`+(o>1?` ÷ ${o} riders`:''))},
{tip:'Shift to bus, metro or train, car-pool, or go electric (car 0.17 → bus 0.05 kg/km)',cut:[.7,.35],r:'1,5',fact:'Road transport is among the fastest-growing sources of emissions in India.'}),
Z('loc','Transport','Apart from that, how do you get around town for errands and weekends?','Around town: {m}','🚶|Walk or cycle|walk|g;🚌|Bus or metro|pt|g;🛵|My two-wheeler|2w;🚗|My car|car|b;🚕|Auto or cab|cab|b',[['km','How many kilometres a week?','Under 10 km|5;10–30 km|20;30–70 km|50;70–150 km|110|b;150+ km|200|b','about {} a week','!walk']],
(m,s)=>{const e={walk:0,pt:.04,'2w':.05,car:.17,cab:.12}[m];return r((s.km||0)*52*e,`${s.km||0} km × 52 wk × ${e} kg/km`)},{tip:'Walk, cycle or use public transport for short trips',cut:[.6,.3],r:'1,5'}),
Z('ld','Transport','Do you take trips of 200 km or more by road or rail?','For long trips: {m}','🏡|Rarely travel that far|0|g;🚆|Train|rail|g;🚌|Bus|bus;🚗|Car|car|b',[
['n','How many return trips a year?','1–2|1.5;3–5|4;6–10|8;11–20|15;20+|25|b','about {} return trips a year','!0'],
['km','How long is a typical one-way trip?','200–400 km|300;400–800 km|600;800–1,500 km|1100;1,500+ km|1800','about {} one way','!0'],
['cls','Which class do you travel in?','Sleeper or general|0.02;AC chair or 3-tier|0.03;AC 2-tier or 1st AC|0.045','in {}','rail'],
['occ','Who shares the car?','Nobody else|1|b;Two people|2;Three or four people|3.5|g','with {}','car']],
(m,s)=>{const e=m=='0'?0:{bus:.045,car:.17}[m]??s.cls,o=s.occ||1;return r((s.n||0)*2*(s.km||0)*e/o,`${s.n||0} trips ×2 × ${s.km||0} km × ${e} kg/pkm`+(o>1?` ÷ ${o}`:''))},{tip:'Prefer trains for long trips; share the car',cut:[.6,.3],r:'1,5'}),

function results(){$('#svy').classList.remove('on');$('#res').classList.add('on');$('#hint').style.display='block';document.body.classList.add('rs');$('#bub').classList.remove('s');mk('point');
const hh=+A.hh.m,rows=[];let E=0;VIS=Q.filter(q=>!q.if||q.if(A));VIS.forEach(q=>{const a=A[q.id];if(!a)return;const x=q.f(a.m,a.s,hh,E,A);rows.push({q,a,kg:x[0],t:x[1]});if(x[2])E+=x[0]});
const N=v=>Math.round(v).toLocaleString('en-IN'),tn=v=>(v/1000).toFixed(2),tot=Math.max(0,rows.reduce((s,x)=>s+x.kg,0)),fair=2300;
const cs=CAT.map(c=>rows.filter(x=>x.q.c==c&&x.kg>0).reduce((s,x)=>s+x.kg,0)),pos=cs.reduce((a,b)=>a+b,0)||1,credit=-rows.filter(x=>x.kg<0).reduce((s,x)=>s+x.kg,0);
const top=rows.filter(x=>x.kg>0).sort((a,b)=>b.kg-a.kg).slice(0,6),mxT=top[0]?top[0].kg:1;
const recs=rows.filter(x=>x.q.cut&&x.q.tip&&x.kg>0&&x.a.q!='g').map(x=>({x,s:x.kg*x.q.cut[x.a.q=='b'?0:1]})).filter(y=>y.s>5).sort((a,b)=>b.s-a.s).slice(0,8),save=recs.reduce((s,y)=>s+y.s,0),after=Math.max(0,tot-save),trees=Math.ceil(after/22);
const od=tot>fair?Math.ceil(365*fair/tot):0,dt=od?new Date(new Date().getFullYear(),0,od).toLocaleDateString('en-IN',{day:'numeric',month:'long'}):'',vol=tot*.556,mxB=Math.max(tot,4700);
const bm=(l,v,c)=>`<div class="cb"><span>${l}</span><i style="width:${Math.max(2,v/mxB*60)}%;${c?'background:'+c:''}"></i><em>${tn(v)} t</em></div>`,cn=A.cn,imp=['','Heatwaves','Floods and cyclones','Water scarcity','Food prices and crops','Air pollution and health'];
const grp=CAT.map((c,i)=>{const rr=rows.filter(x=>x.q.c==c);return rr.length?`<details><summary>${c}: ${N(cs[i])} kg (${Math.round(cs[i]/pos*100)}%)</summary>${rr.map(x=>`<div class="rec"><b>${x.q.t}</b><br>${x.a.sen}<br><small>${x.t} = <b>${N(x.kg)} kg</b> [${x.q.r||'—'}]</small></div>`).join('')}</details>`:''}).join('');
window._sum=`Carbon footprint: ${tn(tot)} t CO2e/yr (${name})\n`+rows.map(x=>`${x.q.c} | ${x.a.sen.replace(/<[^>]+>/g,'')} | ${N(x.kg)} kg`).join('\n');
$('#res').innerHTML=`<section><div class="sub">${name}, your footprint is</div><div class="big" id="cnt">0.00</div><div class="sub"><b>tonnes of CO₂e per year</b> · ${N(tot/365)} kg every single day · ${tot>fair?`<b>${(tot/fair).toFixed(1)}×</b> the 1.5°C-aligned share`:'within the 1.5°C-aligned share 🎉'}</div>
<div class="eq"><div><b>${N(tot/.17)} km</b>driving a petrol car</div><div><b>${N(tot/312)}×</b>Delhi–Mumbai return flights</div><div><b>${N(tot/22)}</b>mature trees working a full year</div><div><b>${N(vol)} m³</b>of pure CO₂ gas ≈ ${(vol/2500*100).toFixed(0)}% of an Olympic pool</div>${od?`<div><b>${dt}</b>the day your fair carbon budget runs out</div>`:''}</div><p class="sub">⬇️ Swipe up — Mowgli will guide you</p></section>
<section><h2>Where it comes from</h2>${CAT.map((c,i)=>cs[i]?`<div class="cb"><span>${c}</span><i style="width:${cs[i]/pos*60}%;background:${CCOL[i]}"></i><em>${N(cs[i])} kg · ${Math.round(cs[i]/pos*100)}%</em></div>`:'').join('')}${credit?`<div class="cb"><span>Trees credit</span><i style="width:${credit/pos*60}%;background:#2fa37a"></i><em>−${N(credit)} kg</em></div>`:''}<h2 style="margin-top:18px;font-size:22px">Your biggest single sources</h2>${top.map(x=>`<div class="cb"><span>${x.q.c}: ${x.a.ml}</span><i style="width:${x.kg/mxT*45}%"></i><em>${N(x.kg)} kg</em></div>`).join('')}</section>
<section><h2>The math, line by line</h2><div class="sub">Every answer × an emission factor. Tap a category to see each sentence you wrote, the formula and the reference [#].</div>${grp}</section>
<section><h2>How you compare</h2>${bm('You',tot,'linear-gradient(90deg,#2fa37a,#f2c14e)')}${bm('India average',1900,'#7ddc9b')}${bm('1.5°C-aligned',fair,'#9ad0ff')}${bm('World average',4700,'#ff9b54')}<p class="sub">Per-capita CO₂ from IEA/Global Carbon Project; the 1.5°C-aligned figure is the commonly cited ≈2.3 t/yr per person by 2030. ${od?`At your pace, you would use up your fair yearly share by <b>${dt}</b>.`:'Your pace fits inside the fair share. Keep it up!'}</p></section>
<section><h2>Your action plan</h2><div class="sub">Ranked by CO₂ saved per year. Savings come from emission-factor ratios (shown in each tip).</div>${recs.map(y=>`<div class="rec">${y.x.q.tip}<br><small>${y.x.q.c}: ${y.x.a.ml} · now ${N(y.x.kg)} kg →</small> <b>saves ≈${N(y.s)} kg/yr</b></div>`).join('')||'<div class="rec">You already chose the greenest options! 🌟</div>'}<div class="row"><b>Before:</b> ${tn(tot)} t → <b>After:</b> ${tn(after)} t (−${tn(save)} t)</div>${bm('Before',tot)}${bm('After',after,'#2fa37a')}</section>
<section><h2>Trees for what remains</h2><div class="big" style="font-size:clamp(48px,12vw,96px)">🌳 ${N(trees)}</div><div class="sub">${tn(after)} t remaining ÷ ≈22 kg CO₂ per mature tree per year. Saplings take years to reach this, so plant, protect and revisit them.</div><p>${SP.map(s=>`<span class="sp"><b>${s[0]}</b> · ${s[1]}</span>`).join('')}</p></section>
<section><h2>Your pledge, ${name}</h2>${cn?`<div class="rec">You told us you are <b>${cn.ml.toLowerCase()}</b> about climate change${cn.s.im?`, most worried about <b>${imp[cn.s.im]}</b>`:''}${cn.l.bl?`, and held back by <b>${cn.l.bl.toLowerCase()}</b>`:''}.</div>`:''}<div class="sub">Pick up to 3 promises to yourself</div>${['I will carry a refill bottle & cloth bag','I will walk, cycle or use public transport more','I will set AC to 24–26 °C','I will eat more local, seasonal, plant-rich food','I will plant and care for a native tree','I will never burn waste or stubble','I will tell 3 friends about this'].map(p=>`<button class="pl" onclick="pl(this)">⬜ ${p}</button>`).join('')}<p class="sub">📸 <b>Take a screenshot</b> of your score and plan — nothing is saved.</p><button class="go" onclick="location.reload()">🔄 Retake</button> <button class="go" style="background:#ffffff22;color:#fff;box-shadow:none" onclick="cp()">📋 Copy my answers</button></section>
<section><h2>Method & sources</h2><small><b>Footprint = Σ (activity × emission factor), per person per year.</b> Household items (energy, cooking, water, waste, farm) ÷ household size (${hh}). Key factors: grid 0.71 kg/kWh · LPG 3.0 kg/kg · petrol car 0.13–0.24 kg/km · rice 3.0 kg/kg · milk 2.5 kg/L · chicken 6 · mutton 22 · beef/buffalo 25 kg/kg · urea 4.0 kg/kg · paddy CH₄ 1.3 kg/ha/day · residue burning 95 kg/t. Tree credit: 10 kg/yr per young tree you look after. These are national-average estimates, not measurements; uncertainty is ±20–40%. Questions, answers and totals stay on your device unless you choose to copy them.</small><ol>${REF.map(r=>`<li>${r}</li>`).join('')}</ol><small>A Fundamentals of Climate Change (FCC) project, made for climate awareness.</small></section>`;
let s0=performance.now();(function f(n){const k=Math.min(1,(n-s0)/2500);$('#cnt').textContent=(tot/1000*(1-Math.pow(1-k,3))).toFixed(2);if(k<1)requestAnimationFrame(f)})(s0)}
function pl(b){const on=b.classList.contains('on');if(!on&&document.querySelectorAll('.pl.on').length>=3)return;b.classList.toggle('on');b.textContent=(on?'⬜ ':'✅ ')+b.textContent.slice(2)}
function cp(){try{navigator.clipboard.writeText(window._sum).then(()=>alert('Copied!'),()=>prompt('Copy your answers:',window._sum))}catch(e){prompt('Copy your answers:',window._sum)}}
</script></body></html>
